name: Market Briefing (on demand)

on:
  # Runs automatically at 8:00 AM PST (winter). Adjust for DST in summer.
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 8:00 AM PST
  workflow_dispatch:        # keeps the manual "Run workflow" button

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install feedparser requests

      - run: python news_agent.py
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
